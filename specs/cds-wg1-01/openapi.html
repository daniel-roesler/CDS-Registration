<!-- /assets/swagger-ui-5.32.12-dist/index.html (modified to jekyll layout) -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <!--
    (switch to CDS title)
    <title>Swagger UI</title>
    -->
    <title>CDS WG1 - OpenAPI schemas</title>

    <link rel="stylesheet" type="text/css" href="/CDS-Registration/assets/swagger-ui-5.32.12-dist/swagger-ui.css" />
    <link rel="stylesheet" type="text/css" href="/CDS-Registration/assets/swagger-ui-5.32.12-dist/index.css" />

    <!--
    (switch to CDS favicon)
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    -->
    <link rel="icon" type="image/png" href="/CDS-Registration/assets/favicon.png">

  </head>

  <body>
    <div id="swagger-ui"></div>
    <script src="/CDS-Registration/assets/swagger-ui-5.32.12-dist/swagger-ui-bundle.js" charset="UTF-8"> </script>
    <script src="/CDS-Registration/assets/swagger-ui-5.32.12-dist/swagger-ui-standalone-preset.js" charset="UTF-8"> </script>

    <!--
    (switch to putting initializer on the specific jekyll page)
    <script src="./swagger-initializer.js" charset="UTF-8"> </script>
    -->
    <script>
    // /assets/swagger-ui-5.32.12-dist/swagger-initializer.js (modified for CDS specs)
    window.onload = function() {
        window.ui = SwaggerUIBundle({
            urls: [
                {
                    "name": "CDS-WG1-01 (\"Server Metadata\")",
                    "url": "/CDS-Registration/specs/cds-wg1-01/dev/cds-wg1-01_openapi_schema.json",
                },
            ],
            queryConfigEnabled: false,
            dom_id: '#swagger-ui',
            deepLinking: true,
            validatorUrl: null,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout",
            onComplete: () => {
                // change top bar logo to a title
                const topBarLink = document.querySelector(".topbar-wrapper > a.link");
                topBarLink.innerHTML = "CDS - OpenAPI schemas";
            },
        });
    };
</script>
<style>
    /* hide the top bar logo */
    .topbar-wrapper > a.link svg { visibility: hidden; }
</style>


  </body>
</html>
